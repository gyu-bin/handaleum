plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.assetlocations'
version = '1.0.0'

android {
  namespace "expo.modules.assetlocations"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}
