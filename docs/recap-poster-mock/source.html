<meta charset="utf-8">
<title>회고 포스터 시안</title>
<style>
  :root{
    --paper:#F7F1E8;
    --ink:#2C3E50;
    --ink-soft:#5A6B7A;
    --subtle:#93A1AD;
    --surface-alt:#EFE6DA;
    --border:#D5DCE2;
    --hair:rgba(44,62,80,.18);
    --font:"Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#171C22;font-family:var(--font);padding:64px;display:flex;gap:64px;align-items:flex-start}
  .col{width:1080px;transform-origin:top left}
  .tag{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
  .tag b{font-size:22px;font-weight:600;letter-spacing:4px;color:#6F7E8C}
  .tag h2{font-size:38px;font-weight:600;letter-spacing:-1px;color:#E9E3D8}
  .note{font-size:25px;line-height:38px;color:#77848F;margin-bottom:36px;min-height:76px}

  /* ---------- poster: 1080 x 1350 (4:5) ---------- */
  .poster{
    position:relative;width:1080px;height:1350px;background:var(--paper);
    padding:84px;display:flex;flex-direction:column;
    box-shadow:0 40px 90px rgba(0,0,0,.5);
  }
  .grain{
    position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }

  .month{
    font-size:96px;line-height:104px;font-weight:700;letter-spacing:-5px;color:var(--ink);
  }
  .rule{height:1px;background:var(--hair);margin-top:28px}

  .board{flex:1;display:flex;align-items:center;justify-content:center}
  .grid{position:relative}
  .rail{position:absolute;left:0;top:0;pointer-events:none}
  .cell{position:absolute;display:flex;flex-direction:column;align-items:center}
  .disc{
    position:relative;border-radius:50%;overflow:hidden;
    background:var(--surface-alt);border:1px solid var(--border);
  }
  .disc.on{border:6px solid var(--ink)}
  .disc.empty{background:var(--paper);border:2px solid var(--border)}
  .disc img{display:block;width:100%;height:100%;object-fit:cover}
  .cap{
    margin-top:12px;text-align:center;color:var(--ink-soft);
    font-weight:500;letter-spacing:-.6px;white-space:nowrap;
  }

  .foot{display:flex;align-items:baseline;justify-content:space-between}
  .foot .left{display:flex;align-items:center;gap:16px}
  .tick{width:6px;height:30px;background:var(--ink)}
  .stat{
    font-size:30px;font-weight:600;letter-spacing:.4px;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .stat em{font-style:normal;font-weight:500;color:var(--subtle);letter-spacing:0}
  .brand{font-size:30px;font-weight:700;letter-spacing:.4px;color:var(--ink)}
</style>

<div class="col" id="colA">
  <div class="tag"><b>안 1</b><h2>고른 곳만</h2></div>
  <p class="note">선택하지 않은 칸은 뺀다. 원이 커져 사진이 살고, 레일은 고른 열 곳만 잇는다.</p>
  <div class="poster" data-variant="picked"></div>
</div>

<div class="col" id="colB">
  <div class="tag"><b>안 2</b><h2>빈 타원 유지</h2></div>
  <p class="note">그 달의 모든 칸을 남기고 안 고른 곳은 빈 타원으로. 레일이 한 달 전체를 관통하지만 원이 작아진다.</p>
  <div class="poster" data-variant="all"></div>
</div>

/** Unselected slots, scattered through the month the way a real board looks. */
const BLANK_AT = [2, 5, 9, 11, 13, 15];

function snakeCell(i, cols){
  const row = Math.floor(i/cols);
  const c = i % cols;
  return { row, col: row % 2 === 0 ? c : cols-1-c };
}
// same curve as src/features/cards/utils/recapBoard.ts
function railPath(count, cols, cell, rowH, cy, gapX){
  if (count < 2) return '';
  const step = cell + gapX, pts = [];
  for (let i=0;i<count;i++){
    const {row,col} = snakeCell(i,cols);
    pts.push({ x: col*step + cell/2, y: row*rowH + cy });
  }
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i=1;i<pts.length;i++){
    const a = pts[i-1], b = pts[i];
    if (a.y === b.y) d += ` L ${b.x} ${b.y}`;
    else { const m = (a.y+b.y)/2; d += ` C ${a.x} ${m}, ${b.x} ${m}, ${b.x} ${b.y}`; }
  }
  return d;
}

function buildNodes(variant){
  if (variant === 'picked') return PLACES.map(p => ({ ...p, on:true }));
  const total = PLACES.length + BLANK_AT.length;
  const nodes = [];
  let pi = 0;
  for (let i=0; i<total; i++){
    if (BLANK_AT.includes(i) || pi >= PLACES.length) nodes.push({ on:false });
    else nodes.push({ ...PLACES[pi++], on:true });
  }
  return nodes;
}

function render(poster){
  const nodes = buildNodes(poster.dataset.variant);
  const rows = Math.ceil(nodes.length / COLS);

  const INNER_W = 1080 - 84*2;          // 912
  const GAP_X = 40;
  const cell = (INNER_W - GAP_X*(COLS-1)) / COLS;

  // vertical budget left for the board between header and footer
  const BOARD_H = 1350 - 84*2 - 132 - 28 - 60 - 56 - 40;
  const CAP_GAP = 12, CAP_PAD = 30;
  const capFont = rows > 4 ? 26 : 31;
  const capLine = Math.round(capFont * 1.3);
  let rowH = Math.floor(BOARD_H / rows);
  let disc = Math.min(cell, rowH - CAP_GAP - capLine - CAP_PAD);
  rowH = disc + CAP_GAP + capLine + CAP_PAD;

  const gridW = INNER_W, gridH = rows * rowH;
  const rail = railPath(nodes.length, COLS, cell, rowH, disc/2, GAP_X);

  const cells = nodes.map((n, i) => {
    const { row, col } = snakeCell(i, COLS);
    const x = col * (cell + GAP_X);
    const y = row * rowH;
    const inner = n.on
      ? `<div class="disc on" style="width:${disc}px;height:${disc}px"><img src="${n.src}"></div>
         <div class="cap" style="font-size:${capFont}px;line-height:${capLine}px;max-width:${cell}px">${n.name}</div>`
      : `<div class="disc empty" style="width:${disc}px;height:${disc}px"></div>`;
    return `<div class="cell" style="left:${x}px;top:${y}px;width:${cell}px">${inner}</div>`;
  }).join('');

  poster.innerHTML = `
    <div class="month">팔월</div>
    <div class="rule"></div>
    <div class="board">
      <div class="grid" style="width:${gridW}px;height:${gridH}px">
        <svg class="rail" width="${gridW}" height="${gridH}">
          <path d="${rail}" fill="none" stroke="#5A6B7A" stroke-width="4.5"
                stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        ${cells}
      </div>
    </div>
    <div class="foot">
      <div class="left">
        <div class="tick"></div>
        <div class="stat">2026.08 <em>· 10곳 · 24일</em></div>
      </div>
      <div class="brand">한달음</div>
    </div>
    <div class="grain"></div>`;
}

document.querySelectorAll('.poster').forEach(render);

// single-poster export mode
const only = new URLSearchParams(location.search).get('only');
if (only){
  document.body.style.cssText = 'margin:0;padding:0;background:#F7F1E8;display:block';
  document.querySelectorAll('.col').forEach(c => { if (c.id !== 'col'+only) c.remove(); });
  document.querySelectorAll('.tag,.note').forEach(e => e.remove());
  const p = document.querySelector('.poster');
  if (p) p.style.boxShadow = 'none';
}
</script>
