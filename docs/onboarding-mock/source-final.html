<meta charset="utf-8">
<title>한달음 온보딩 — 확정안</title>
<style>
  :root{
    --paper:#F7F1E8;
    --paper-hi:#FFFBF5;
    --water:#BFD7E8;
    --ink:#2C3E50;
    --ink-soft:#5A6B7A;
    --subtle:#93A1AD;
    --hair:#E8E4DC;
    --chip:#F6F0E4;
    --font:"Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#171C22;font-family:var(--font);
    padding:70px 60px 84px;display:flex;gap:64px;
    align-items:flex-start;justify-content:center;
  }
  .board{width:393px}
  .board-tag{display:flex;align-items:baseline;gap:11px;margin-bottom:7px}
  .board-tag b{font-size:11px;font-weight:600;letter-spacing:2.4px;color:#6F7E8C}
  .board-tag h2{font-size:19px;font-weight:600;letter-spacing:-.5px;color:#E9E3D8}
  .board-note{min-height:38px;font-size:12.5px;line-height:19px;color:#77848F;margin-bottom:24px;letter-spacing:-.2px}

  /* ---------- device ---------- */
  .phone{
    position:relative;width:393px;height:852px;border-radius:46px;
    overflow:hidden;background:var(--paper);
    box-shadow:0 40px 84px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07);
  }
  .grain{
    position:absolute;inset:0;z-index:60;pointer-events:none;opacity:.16;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }
  .status{
    position:absolute;top:0;left:0;right:0;height:54px;z-index:45;
    display:flex;align-items:center;justify-content:space-between;padding:17px 32px 0;
  }
  .status .t{font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--ink)}
  .status .r{display:flex;align-items:center;gap:6px}
  .status .bars{display:flex;align-items:flex-end;gap:2px;height:11px}
  .status .bars i{width:3px;background:var(--ink);border-radius:1px;display:block}
  .status .bars i:nth-child(1){height:4px}
  .status .bars i:nth-child(2){height:6px}
  .status .bars i:nth-child(3){height:8.5px}
  .status .bars i:nth-child(4){height:11px}
  .status .bat{width:25px;height:12px;border:1.2px solid var(--ink);border-radius:3.5px;position:relative;opacity:.9}
  .status .bat::after{content:"";position:absolute;inset:2px;right:7px;background:var(--ink);border-radius:1.5px}
  .home{
    position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
    width:139px;height:5px;border-radius:3px;background:var(--ink);opacity:.26;z-index:46;
  }

  /* ---------- shared ---------- */
  .wordmark{font-size:13px;font-weight:700;letter-spacing:.4px;color:rgba(44,62,80,.62)}
  .meta{font-size:11px;font-weight:500;letter-spacing:.7px;color:rgba(44,62,80,.4);font-variant-numeric:tabular-nums}
  .headline{font-size:27px;line-height:38px;letter-spacing:-1.1px;color:var(--ink)}
  .headline .lead{display:block;font-weight:300;color:rgba(44,62,80,.72)}
  .headline .key{display:block;font-weight:700}
  .subhead{font-size:14px;line-height:21px;letter-spacing:-.3px;color:var(--ink-soft)}
  .rule{height:1px;background:var(--hair)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .toggle-row span{font-size:13.5px;line-height:19px;font-weight:600;letter-spacing:-.35px;color:var(--ink)}
  .sw{width:51px;height:31px;border-radius:16px;background:var(--ink);position:relative;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:50%;background:#FFFDF8;box-shadow:0 2px 5px rgba(44,62,80,.32)}
  .hint{font-size:11.5px;line-height:16px;letter-spacing:-.1px;color:var(--subtle)}
  .cta{
    height:54px;border-radius:15px;background:var(--ink);display:flex;align-items:center;justify-content:center;
    font-size:15.5px;font-weight:600;letter-spacing:-.4px;color:#FBF7F0;box-shadow:0 8px 18px rgba(44,62,80,.2);
  }

  .print{
    position:absolute;background:var(--paper-hi);padding:5px 5px 0;border-radius:2px;
    box-shadow:0 7px 15px rgba(31,44,58,.2),0 1px 2px rgba(31,44,58,.14);z-index:20;
  }
  .print img{display:block;width:64px;height:64px;object-fit:cover;border-radius:1px}
  .print .cap{
    height:18px;display:flex;align-items:center;justify-content:space-between;
    font-size:9.5px;font-weight:600;letter-spacing:.1px;color:var(--ink-soft);
    padding:0 1px;font-variant-numeric:tabular-nums;
  }
  .print .cap em{font-style:normal;color:var(--subtle);font-weight:500}

  .dot{
    position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink);
    box-shadow:0 0 0 2.5px var(--chip);z-index:15;transform:translate(-50%,-50%);
  }
  svg.overlay{position:absolute;inset:0;z-index:10;pointer-events:none}

  /* ---------- A : 펼친 지도 ---------- */
  .a-map{position:absolute;top:0;left:0;right:0;height:500px;background:var(--water);overflow:hidden}
  .a-map .krwrap{position:absolute;left:88px;top:34px;width:239px;height:460px}
  .a-sheet{
    position:absolute;left:0;right:0;bottom:0;height:376px;background:var(--paper);
    border-radius:28px 28px 0 0;box-shadow:0 -14px 32px rgba(31,44,58,.17);padding:30px 24px 0;z-index:30;
  }

  /* ---------- B : 전면 지도 + 도장 ---------- */
  .b-map{position:absolute;inset:0;background:var(--water);overflow:hidden}
  .b-map .krwrap{position:absolute;left:32px;top:44px;width:332px;height:640px}
  .b-veil{
    position:absolute;left:0;right:0;top:398px;bottom:0;z-index:25;
    background:linear-gradient(180deg,rgba(247,241,232,0) 0%,rgba(247,241,232,.32) 20%,rgba(247,241,232,.82) 33%,rgba(247,241,232,.985) 41%,#F7F1E8 47%);
  }
  .stamp{
    position:absolute;width:64px;height:64px;border-radius:50%;z-index:20;
    border:1.7px solid rgba(44,62,80,.62);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    mix-blend-mode:multiply;transform-origin:center;
  }
  .stamp::before{content:"";position:absolute;inset:4px;border-radius:50%;border:.8px solid rgba(44,62,80,.38)}
  .stamp b{font-size:12.5px;font-weight:700;letter-spacing:-.3px;color:rgba(44,62,80,.78)}
  .stamp i{font-style:normal;font-size:8.5px;font-weight:600;letter-spacing:.6px;color:rgba(44,62,80,.55);font-variant-numeric:tabular-nums}
  .stamp u{position:absolute;top:19px;width:26px;height:.8px;background:rgba(44,62,80,.3);text-decoration:none}
  .b-foot{position:absolute;left:24px;right:24px;bottom:44px;z-index:30}

  /* ---------- C : 접힌 지도 한 장 ---------- */
  .c-sheetmap{
    position:absolute;left:22px;top:110px;width:349px;height:442px;background:var(--water);
    border-radius:2px;overflow:hidden;
    box-shadow:0 18px 34px rgba(31,44,58,.16),0 2px 5px rgba(31,44,58,.14),
               inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 1px rgba(44,62,80,.07);
  }
  .c-sheetmap .krwrap{position:absolute;left:70px;top:18px;width:209px;height:402px}
  .sea{position:absolute;z-index:9;font-size:10.5px;font-weight:500;letter-spacing:3px;color:rgba(44,62,80,.28)}
  .c-legend{
    position:absolute;left:13px;bottom:11px;z-index:12;display:flex;align-items:center;gap:6px;
    font-size:10px;letter-spacing:-.1px;color:rgba(44,62,80,.6);font-weight:500;
  }
  .c-legend i{width:6px;height:6px;border-radius:50%;background:var(--ink);display:block;opacity:.75}
  .c-txt{position:absolute;left:24px;right:24px;top:578px}
  .c-foot{position:absolute;left:24px;right:24px;bottom:44px}
  .c-note{position:absolute;left:24px;right:24px;top:716px}

  /* ---------- D : 측량 시트 ---------- */
  .d-frame{
    position:absolute;left:20px;right:20px;top:52px;bottom:30px;z-index:5;
    border:1px solid rgba(44,62,80,.16);pointer-events:none;
  }
  .d-frame b{position:absolute;width:11px;height:11px;border:0 solid rgba(44,62,80,.5)}
  .d-frame b:nth-child(1){left:-1px;top:-1px;border-left-width:1px;border-top-width:1px}
  .d-frame b:nth-child(2){right:-1px;top:-1px;border-right-width:1px;border-top-width:1px}
  .d-frame b:nth-child(3){left:-1px;bottom:-1px;border-left-width:1px;border-bottom-width:1px}
  .d-frame b:nth-child(4){right:-1px;bottom:-1px;border-right-width:1px;border-bottom-width:1px}
  .d-plate{
    position:absolute;left:34px;right:34px;top:96px;height:276px;background:var(--water);
    overflow:hidden;box-shadow:inset 0 0 0 1px rgba(44,62,80,.1);
  }
  .d-plate .krwrap{position:absolute;left:140px;top:8px;width:136px;height:262px}
  .d-strip{position:absolute;left:34px;right:34px;top:400px;display:flex;gap:20px;z-index:20}
  .d-card{width:95px}
  .d-card img{display:block;width:95px;height:78px;object-fit:cover;background:var(--paper-hi)}
  .d-card .bar{height:1px;background:rgba(44,62,80,.45);margin-top:6px}
  .d-card .lab{
    display:flex;align-items:center;gap:5px;margin-top:5px;
    font-size:10px;font-weight:600;letter-spacing:-.1px;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  }
  .d-card .lab em{font-style:normal;font-weight:500;color:var(--subtle);margin-left:auto}
  .key-no{font-style:normal;
    width:13px;height:13px;border-radius:50%;border:.9px solid rgba(44,62,80,.45);
    display:flex;align-items:center;justify-content:center;flex:none;
    font-size:8px;font-weight:700;color:rgba(44,62,80,.7);font-variant-numeric:tabular-nums;
  }
  .key-map{
    position:absolute;z-index:16;width:15px;height:15px;border-radius:50%;
    background:var(--chip);border:.9px solid rgba(44,62,80,.5);
    display:flex;align-items:center;justify-content:center;
    font-size:8.5px;font-weight:700;color:rgba(44,62,80,.8);font-variant-numeric:tabular-nums;
    transform:translate(-50%,-50%);
  }
  .scale{position:relative;width:174px;height:10px;border-bottom:1px solid rgba(44,62,80,.42)}
  .scale::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
    background:repeating-linear-gradient(90deg,rgba(44,62,80,.32) 0 1px,transparent 1px 11.6px);
  }
  .scale::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:9px;
    background:repeating-linear-gradient(90deg,rgba(44,62,80,.46) 0 1px,transparent 1px 58px);
  }
  .scale-lab{
    position:relative;width:174px;margin-top:5px;height:12px;
    font-size:9.5px;font-weight:500;letter-spacing:.4px;color:rgba(44,62,80,.45);font-variant-numeric:tabular-nums;
  }
  .scale-lab span{position:absolute;transform:translateX(-50%)}
</style>

  <p class="board-note">토글 제거, 버튼 하나. 남은 자리만큼 지도를 키웠다. 권한 전체·일부 선택은 iOS 대화상자가 맡는다.</p>

<script>
  // Land + fine ink coast — same multi-pass recipe as MapSvg, but hairlines
  // stay hairlines at any scale (non-scaling-stroke).
  const PASSES=[[1.6,.10],[1.15,.14],[.85,.22],[.7,.55]];
  const OFF=[[0.9,0.75],[-0.5,0.4],[0.25,-0.2],[0,0]];
  function paint(el){
    const s=el.clientWidth/51.9;          // px per viewBox unit
    const u=v=>(v/s).toFixed(3);          // px -> viewBox units
    let g='<svg viewBox="0 0 51.9 100" width="100%" height="100%">';
    g+=`<use href="#kr" fill="rgba(55,48,40,0.13)" transform="translate(${u(1.4)},${u(1.8)})"/>`;
    g+='<use href="#kr" fill="#E9DFC8"/>';
    g+=`<use href="#kr" fill="#F5EBD6" transform="translate(${u(-0.5)},${u(-0.7)})"/>`;
    PASSES.forEach(([w,o],i)=>{
      const[dx,dy]=OFF[i];
      g+=`<use href="#kr" fill="none" stroke="#3A3F46" stroke-opacity="${o}" stroke-width="${u(w)}" stroke-linejoin="round" stroke-linecap="round" transform="translate(${u(dx)},${u(dy)})"/>`;
    });
    el.innerHTML=g+'</svg>';
  }
  const only=new URLSearchParams(location.search).get('only');
  if(only){
    document.body.style.cssText='margin:0;padding:0;background:#F7F1E8;display:block';
    document.querySelectorAll('.board').forEach(b=>{if(b.dataset.id!==only)b.remove();});
    document.querySelectorAll('.board-tag,.board-note').forEach(e=>e.remove());
    const ph=document.querySelector('.phone');
    ph.style.borderRadius='0';ph.style.boxShadow='none';
  }
  document.querySelectorAll('.krwrap').forEach(paint);
</script>
